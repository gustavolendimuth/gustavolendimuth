<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Gustavo Lendimuth. Full stack developer.">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .flow { stroke-dasharray: 4 6; animation: flow 1.2s linear infinite; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#161B22" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect x="1" y="1" width="878" height="298" rx="14"/></clipPath>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#FF7759"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="299" rx="14" fill="#0D1117" stroke="#30363D"/>
  <rect x="560" y="0" width="320" height="232" fill="url(#grid)" clip-path="url(#card)"/>

  <text x="48" y="64" class="mono" font-size="13" fill="#8B949E" letter-spacing="1">FULL STACK DEVELOPER</text>
  <text x="46" y="122" class="sans" font-size="46" font-weight="700" fill="#E6EDF3" letter-spacing="-1">Gustavo Lendimuth</text>
  <text x="48" y="166" class="sans" font-size="20" fill="#E6EDF3">APIs, integrations and cloud services</text>
  <text x="48" y="194" class="sans" font-size="20" fill="#8B949E">for a platform people pay for every month<tspan fill="#FF7759" class="blink">_</tspan></text>

  <line x1="48" y1="232" x2="832" y2="232" stroke="#30363D"/>
  <text x="48" y="262" class="mono" font-size="13" fill="#8B949E"><tspan fill="#FF7759">●</tspan> Building at APOIA.se   ·   TypeScript · Node.js · AWS · MongoDB   ·   Juiz de Fora, BR</text>

  <path d="M692 72H736" fill="none" stroke="#FF7759" stroke-width="2" class="flow" marker-end="url(#arrow)"/>
  <path d="M790 88V148" fill="none" stroke="#FF7759" stroke-width="2" class="flow" marker-end="url(#arrow)"/>
  <path d="M740 168H696" fill="none" stroke="#FF7759" stroke-width="2" class="flow" marker-end="url(#arrow)"/>
  <rect x="592" y="56" width="100" height="32" rx="6" fill="#161B22" stroke="#30363D"/>
  <text x="642" y="77" class="mono" font-size="13" fill="#E6EDF3" text-anchor="middle">webhook</text>
  <rect x="740" y="56" width="100" height="32" rx="6" fill="#161B22" stroke="#30363D"/>
  <text x="790" y="77" class="mono" font-size="13" fill="#E6EDF3" text-anchor="middle">sqs</text>
  <rect x="740" y="152" width="100" height="32" rx="6" fill="#161B22" stroke="#30363D"/>
  <text x="790" y="173" class="mono" font-size="13" fill="#E6EDF3" text-anchor="middle">lambda</text>
  <rect x="592" y="152" width="100" height="32" rx="6" fill="#161B22" stroke="#30363D"/>
  <text x="642" y="173" class="mono" font-size="13" fill="#E6EDF3" text-anchor="middle">mongodb</text>
</svg>
