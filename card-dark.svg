<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Gustavo Lendimuth. Art director turned full stack developer.">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .draw { stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 1.6s ease-out .3s forwards; }
    .fade { opacity: 0; animation: fade .5s ease-out forwards; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#161B22" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect x="1" y="1" width="878" height="298" rx="14"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="299" rx="14" fill="#0D1117" stroke="#30363D"/>
  <rect x="560" y="0" width="320" height="300" fill="url(#grid)" clip-path="url(#card)"/>

  <text x="48" y="64" class="mono" font-size="13" fill="#8B949E" letter-spacing="1">FULL STACK DEVELOPER · EX ART DIRECTOR</text>
  <text x="46" y="122" class="sans" font-size="46" font-weight="700" fill="#E6EDF3" letter-spacing="-1">Gustavo Lendimuth</text>
  <text x="48" y="166" class="sans" font-size="20" fill="#E6EDF3">Ten years designing what people see.</text>
  <text x="48" y="194" class="sans" font-size="20" fill="#8B949E">Now I build what holds it up<tspan fill="#FF7759">.</tspan></text>

  <line x1="48" y1="232" x2="832" y2="232" stroke="#30363D"/>
  <text x="48" y="262" class="mono" font-size="13" fill="#8B949E"><tspan fill="#FF7759">●</tspan> Building at APOIA.se   ·   TypeScript · Node.js · AWS · MongoDB   ·   Juiz de Fora, BR</text>

  <g transform="translate(0,0)">
    <line x1="612" y1="190" x2="650" y2="58" stroke="#8B949E" stroke-width="1" class="fade" style="animation-delay:1.5s"/>
    <line x1="820" y1="74" x2="770" y2="205" stroke="#8B949E" stroke-width="1" class="fade" style="animation-delay:1.5s"/>
    <path d="M612 190 C650 58 770 205 820 74" fill="none" stroke="#FF7759" stroke-width="3" stroke-linecap="round" class="draw"/>
    <circle cx="650" cy="58" r="4" fill="#0D1117" stroke="#8B949E" class="fade" style="animation-delay:1.6s"/>
    <circle cx="770" cy="205" r="4" fill="#0D1117" stroke="#8B949E" class="fade" style="animation-delay:1.6s"/>
    <rect x="606" y="184" width="12" height="12" fill="#0D1117" stroke="#FF7759" stroke-width="2"/>
    <rect x="814" y="68" width="12" height="12" fill="#FF7759" class="fade" style="animation-delay:1.8s"/>
    <text x="838" y="206" class="mono" font-size="15" fill="#8B949E" text-anchor="end">&lt;/&gt;<tspan fill="#FF7759" class="blink">_</tspan></text>
  </g>
</svg>
